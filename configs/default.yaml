model:
    model_id: "mistralai/Mamba-Codestral-7B-v0.1"
    torch_dtype: "float16"
    device_map: { "": 0 }
    
    
wandb:
    project: "cpp_to_rust"
    entity: "rite"
    

data:
    dataset_path: "datasets/processed/full_dataset.json"
    max_length: 2048

training:
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 2
    eval_strategy: "epoch"
    save_strategy: "steps"
    save_steps: 100
    logging_steps: 5
    save_total_limit: 2
    learning_rate: 5e-5
    weight_decay: 0.01
    num_train_epochs: 1
    optim: "adamw_torch"
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1e-8
    gradient_checkpointing: false
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    report_to: "none"

lora:
    lora_dropout: 0.2
    r: 16
    lora_alpha: 32
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules:
    - "mixer.in_proj"
    - "mixer.out_proj"