model:
    model_id: "mistralai/Mamba-Codestral-7B-v0.1"
    torch_dtype: "float16"
    device_map: { "": 0 }
    
wandb:
    project: "cpp_to_rust"
    entity: "rite-2"

data:
    dataset_path: "datasets/processed/simplified_dataset.json"
    max_length: 1700

training:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 1
    eval_strategy: "epoch"
    save_strategy: "steps"
#    eval_steps: 50
    save_steps: 300
    logging_steps: 5
    save_total_limit: 3
    learning_rate: 7.5e-5
    weight_decay: 0.01
    num_train_epochs: 1
    optim: "adamw_torch"
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1e-8
    gradient_checkpointing: True
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    report_to: "none"

lora:
    lora_dropout: 0.2
    r: 8
    lora_alpha: 16
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules:
    - "mixer.in_proj"
    - "mixer.out_proj"